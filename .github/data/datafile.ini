

VM_NAME=Haiku

VM_OS_NAME=haiku

VM_USER=user

VM_RUNS_ON=ubuntu-latest

VM_PREPARE="pkgman install -y curl"

VM_RUN=@.github/data/run.txt

VM_SET_RELEASE=r1beta5

VM_SHELL_COMMENTS=""

TEST_RELEASES=@conf/test.releases

RELEASE_TABLE=@https://raw.githubusercontent.com/anyvm-org/haiku-builder/refs/heads/main/.github/data/table.md


VM_TEST_EXCLUDE=@.github/data/exclude.txt



VM_SYNC_METHODS_MAP=@.github/data/sync-map.json

VM_TEST_EXCLUDE_MISSING=@.github/data/exclude-missing.txt

VM_BRAND_ICON=feather

VM_BRAND_COLOR=green


VM_TEST_EXCLUDE_SSHFS=@.github/data/exclude-sshfs.txt

VM_TEST_EXCLUDE_NFS=@.github/data/exclude-nfs.txt

VM_TEST_EXCLUDE_SCP=@.github/data/exclude-scp.txt

VM_TEST_EXCLUDE_RSYNC=@.github/data/exclude-rsync.txt

